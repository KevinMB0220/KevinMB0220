name: XP Grid

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-xp-grid.mjs"
      - ".github/workflows/xp-grid.yml"

permissions:
  contents: write

concurrency:
  group: xp-grid
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate XP board
        env:
          # GH_PAT is optional. GITHUB_TOKEN reads the public contribution
          # calendar fine; add a PAT with read:user only if you want private
          # contributions counted too.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-xp-grid.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/xp-grid.svg; then
            echo "No change in the board, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/xp-grid.svg
          git commit -m "chore: refresh XP board [skip ci]"
          git push
